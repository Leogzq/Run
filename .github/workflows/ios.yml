name: Build unsigned iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned developer-service library
        run: bash scripts/fetch-idevice.sh
      - name: Build for iPhone
        run: ./build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RouteLab-unsigned-IPA
          path: build/RouteLab-unsigned.ipa
          if-no-files-found: error
